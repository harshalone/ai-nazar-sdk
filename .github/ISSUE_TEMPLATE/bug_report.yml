name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal code sample if possible.
      render: ts
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: sdk-version
    attributes:
      label: ai-nazar version
      placeholder: "e.g. 0.1.0 (check package.json / npm ls ai-nazar)"
    validations:
      required: true

  - type: dropdown
    id: integration
    attributes:
      label: Integration
      options:
        - wrapOpenAI
        - Manual track() / captureException()
        - Not sure / unrelated
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "e.g. 20.11.0 (run `node -v`)"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output with `debug: true` set on `Nazar.init()`, if applicable.
      render: shell
